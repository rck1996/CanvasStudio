name: Android emulator regression

on:
  push:
    branches: ["audit/**"]
    paths:
      - ".github/workflows/android-emulator.yml"
      - "app/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle/**"
  workflow_dispatch:

concurrency:
  group: android-emulator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  instrumented-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Enable Android emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Run persistence, PSD and raster regression tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_c
          cores: 2
          ram-size: 4096M
          heap-size: 512M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: ./gradlew :app:connectedDebugAndroidTest "-Pandroid.testInstrumentationRunnerArguments.class=com.orbyte.canvasstudio.model.ProjectRepositoryRecoveryTest,com.orbyte.canvasstudio.ui.screens.GalleryTrashUiTest,com.orbyte.canvasstudio.model.ProjectSaveTransactionTest,com.orbyte.canvasstudio.model.ProjectTrashStoreTest,com.orbyte.canvasstudio.model.ProjectVersionStoreTest,com.orbyte.canvasstudio.drawing.BasicPsdCodecTest,com.orbyte.canvasstudio.drawing.TileAtomicWriteTest,com.orbyte.canvasstudio.drawing.TileCheckpointStoreTest,com.orbyte.canvasstudio.drawing.TileCommandIndexTest,com.orbyte.canvasstudio.drawing.SparseTileSurfaceTest" --stacktrace

      - name: Upload emulator test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canvas-emulator-regression-reports
          path: |
            app/build/reports/androidTests/connected/
            app/build/outputs/androidTest-results/connected/
          if-no-files-found: warn
          retention-days: 14
